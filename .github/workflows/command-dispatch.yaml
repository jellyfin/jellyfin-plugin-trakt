# Allows for the definition of PR and Issue /commands
name: '📟 Slash Command Dispatcher'

on:
  issue_comment:
    types:
      - created

jobs:
  call:
    uses: jellyfin/jellyfin-meta-plugins/.github/workflows/command-dispatch.yaml@5f6990aa467ae0a6b62c91ad0502e3e1a53117ce # master
    secrets:
      token: ${{ secrets.JF_BOT_TOKEN }}
