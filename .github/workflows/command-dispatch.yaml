# Allows for the definition of PR and Issue /commands
name: '📟 Slash Command Dispatcher'

on:
  issue_comment:
    types:
      - created

jobs:
  call:
    uses: jellyfin/jellyfin-meta-plugins/.github/workflows/command-dispatch.yaml@3abd0cb4321d944d4d469b731ef98021aaa15346 # master
    secrets:
      token: ${{ secrets.JF_BOT_TOKEN }}
