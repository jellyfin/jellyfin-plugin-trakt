# Allows for the definition of PR and Issue /commands
name: '📟 Slash Command Dispatcher'

on:
  issue_comment:
    types:
      - created

jobs:
  call:
    uses: jellyfin/jellyfin-meta-plugins/.github/workflows/command-dispatch.yaml@9b367ad7b96c2a5e0ce27675815bc9755ae0a971 # master
    secrets:
      token: ${{ secrets.JF_BOT_TOKEN }}
