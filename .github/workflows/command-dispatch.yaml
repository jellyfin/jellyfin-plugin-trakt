# Allows for the definition of PR and Issue /commands
name: '📟 Slash Command Dispatcher'

on:
  issue_comment:
    types:
      - created

jobs:
  call:
    uses: jellyfin/jellyfin-meta-plugins/.github/workflows/command-dispatch.yaml@5ebf9f9455736773ab6f94cdb19fb903ece41b83 # master
    secrets:
      token: ${{ secrets.JF_BOT_TOKEN }}
