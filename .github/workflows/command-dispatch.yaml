# Allows for the definition of PR and Issue /commands
name: '📟 Slash Command Dispatcher'

on:
  issue_comment:
    types:
      - created

jobs:
  call:
    uses: jellyfin/jellyfin-meta-plugins/.github/workflows/command-dispatch.yaml@c5847d4d5a8a577632723fe0ff120d9ddcbc5d09 # master
    secrets:
      token: ${{ secrets.JF_BOT_TOKEN }}
