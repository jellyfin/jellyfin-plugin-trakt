name: '📝 Create/Update Release Draft & Release Bump PR'

on:
  push:
    branches:
      - master
    paths-ignore:
      - build.yaml
  workflow_dispatch:
  repository_dispatch:
    types:
      - update-prep-command

jobs:
  call:
    uses: jellyfin/jellyfin-meta-plugins/.github/workflows/changelog.yaml@bd147a5ba80bc60d6c94f8842afe716f6a2f626a # master
    with:
      repository-name: jellyfin/jellyfin-plugin-trakt
    secrets:
      token: ${{ secrets.JF_BOT_TOKEN }}
